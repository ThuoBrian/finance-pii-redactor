[project]
name = "finance-pii-redactor"
version = "0.1.0"
description = "Local Streamlit tool that pseudonymizes names in Excel, PDF, and Word files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openpyxl>=3.1.0,<4.0",
    "pandas>=3.0,<4.0",
    "presidio-analyzer>=2.2.354,<3.0",
    "spacy>=3.7.0,<4.0",
    "streamlit>=1.35.0,<2.0",
    "pymupdf>=1.24.0,<2.0",
    # Import name is "docx". Note: there is a separate, unmaintained "docx"
    # package on PyPI - this must stay "python-docx".
    "python-docx>=1.1.0,<2.0",
    # The spaCy NER model is a tracked dependency (pinned wheel) so `uv sync`
    # installs it and never prunes it. This replaces the separate, fragile
    # `python -m spacy download` step in run.bat / run.sh.
    "en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "pyahocorasick>=2.3.1",
]


[dependency-groups]
dev = [
    "codespell>=2.4.1",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.7.4",
    "types-openpyxl>=3.1.5.20260807",
]

[tool.ruff]
line-length = 88
fix = true
# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
# docs: https://docs.astral.sh/ruff/rules/
select = [
    "F",   # Pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "D",   # flake8-docstrings
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

ignore = [
    # do not enable if formatting
    # docs: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab indentation
    "E111",   # indentation
    "E114",   # indentation
    "E117",   # over indented
    "D206",   # indent with spaces
    "D300",   # triple single quotes
    "E501",   # line length regulated by formatter
    "D105",   # missing docstring in magic method
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "SIM110", # Use all instead of `for` loop
    "TRY003", # Avoid specifying long messages outside the exception class
    "D205",   # 1 blank line required between summary line and description
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
# Test functions are self-describing by name; don't require docstrings.
"tests/**" = ["D103"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=finance_redactor --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
# app.py (the Streamlit composition root) and finance_redactor/presentation/
# (Streamlit widgets/session state) are deliberately not unit-tested - see
# CLAUDE.md's "Tooling configuration" section - so they're excluded from the
# measured/enforced total below rather than dragging it down with a number
# nothing can move (there's no unit-testable behavior to add tests for
# there; that would need Streamlit's own testing harness, a separate effort).
# domain/application/infrastructure - the actual business logic - stay in.
omit = ["finance_redactor/presentation/*"]

[tool.coverage.report]
# 80 is a real floor just under the current ~90%+ for the measured layers
# (domain/application/infrastructure), not a number picked to look good -
# it's meant to fail CI on a genuine regression, with a little headroom for
# normal fluctuation as code is added.
fail_under = 80
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
# Scoped to app.py/finance_redactor/ only (see the CI invocation) - not
# tests/. Test doubles (fakes, unittest.mock.MagicMock/patch) routinely don't
# structurally satisfy a Protocol or preserve MagicMock's dynamic attributes
# under a type checker; fully typing every test double is a real but
# separate effort from type-checking production code, so it's out of scope
# here rather than silently loosened with broad ignores.
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Neither ships a py.typed marker or a types-* stub package on PyPI - a
# known, accepted gap in each library's own packaging, not something this
# project can fix. Everything else (pandas, openpyxl) has real stubs
# installed above instead of being blanket-ignored here.
module = ["fitz", "ahocorasick"]
ignore_missing_imports = true

[tool.codespell]
builtin = "clear,rare,informal,usage,code,names"
ignore-words-list = "jupyter,ipa,spacy,ws,thead,GOTCHA,gotcha,master,slave,falsy"
skip = "uv.lock,*.txt,*.csv"
