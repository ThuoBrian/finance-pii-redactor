name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    # macOS too: a dependency pin that ships no macOS wheel (as onnxruntime
    # did for Intel Macs) should fail here, not on a user's machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --python 3.12

      # Lint, format check, mypy, tests with the coverage gate, codespell.
      # The justfile's `check` recipe is the single list of what CI runs.
      - name: Run checks
        run: uv run just check
