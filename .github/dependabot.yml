version: 2
updates:
  # Python dependencies declared in pyproject.toml. Dependabot reads the
  # version constraints there and opens a PR when a newer release exists
  # (including one that fixes a known CVE). The "uv" ecosystem updates
  # pyproject.toml and uv.lock together, so CI's `uv sync --locked` passes
  # without a manual `uv lock` ("pip" changed pyproject.toml only).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Keep the CI workflow's own actions (actions/checkout, astral-sh/setup-uv)
  # up to date too - these run with repo access, so an out-of-date action
  # pinned to an old tag is itself a supply-chain risk worth tracking.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
