version: 2
updates:
  # Python dependencies declared in pyproject.toml. Dependabot reads the
  # version constraints there and opens a PR when a newer release exists
  # (including one that fixes a known CVE). The "uv" ecosystem updates
  # pyproject.toml and uv.lock together, so CI's `uv sync --locked` passes
  # without a manual `uv lock` ("pip" changed pyproject.toml only).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # The React interface's npm packages (frontend/package-lock.json).
  # Minor and patch updates arrive together in one weekly PR; each major
  # update (Vite, TypeScript, a test library...) gets its own PR, so a
  # breaking change is reviewed on its own instead of hiding in the group.
  # Every one of these PRs also needs `just web-build` run and the rebuilt
  # finance_redactor/presentation/static/ committed, or CI's bundle check
  # fails: Dependabot cannot run the build itself. That step stays manual
  # on purpose; see docs/troubleshooting.md.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep the CI workflow's own actions (actions/checkout, astral-sh/setup-uv)
  # up to date too - these run with repo access, so an out-of-date action
  # pinned to an old tag is itself a supply-chain risk worth tracking.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
