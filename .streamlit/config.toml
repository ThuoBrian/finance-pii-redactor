[theme]
# The logo (assets/data-privacy-ai-dark-nobg.svg) is white-on-transparent and
# needs a dark background to be visible.
base = "dark"
# Blue for actions; red is kept for the Confidential download card and real
# warnings, so it still means "careful". #2563EB clears 5.17:1 against white
# button-label text (WCAG AA needs 4.5:1) and 3.66:1 as an accent on the dark
# background (3:1 for UI components). The previous red, #D32F2F, was 4.98:1
# and 3.80:1.
primaryColor = "#2563EB"
# Explicit so the contrast figures in this file stay checkable. All pairs below
# clear WCAG AA (text >= 4.5:1, borders/UI >= 3:1) - see the checks in the
# CHANGELOG entry. Fonts stay on Streamlit's bundled default: no web fonts, so
# the app makes no external requests.
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1D27"
textColor = "#FAFAFA"
# Lighter than primaryColor for text: 10.48:1 on the dark background.
linkColor = "#93C5FD"
borderColor = "#6B7280"
dataframeHeaderBackgroundColor = "#1E222D"
baseRadius = "0.75rem"
buttonRadius = "0.5rem"

[client]
# Hides Streamlit's developer toolbar (the "Deploy" button and its menu),
# which means nothing to the people using this tool.
toolbarMode = "minimal"

[browser]
# Streamlit sends anonymous usage statistics by default. This app promises that
# nothing leaves the machine, so switch it off.
gatherUsageStats = false
